<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 450" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6572"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a4fb0"/>
    </marker>
  </defs>
  <style>
    .bx { fill:#fff; stroke:#9aa5b1; stroke-width:2; rx:10 }
    .ml { fill:#f7f5ff; stroke:#6a4fb0; stroke-width:2.5; rx:10 }
    .fi { fill:#fff8ec; stroke:#b07d28; stroke-width:2.5; rx:10 }
    .hd { font-size:18px; font-weight:700; fill:#16181d }
    .tx { font-size:14px; fill:#4a525c }
    .sm { font-size:12.5px; fill:#8a929c }
    .fl { stroke:#5a6572; stroke-width:2.2; fill:none; marker-end:url(#ar) }
  </style>

  <!-- 1 INPUT -->
  <rect class="bx" x="10" y="58" width="196" height="242"/>
  <text class="hd" x="26" y="88">Inputs, per frame</text>
  <text class="tx" x="26" y="120">15 orientations,</text>
  <text class="tx" x="26" y="138">anchored by the phone</text>
  <text class="tx" x="26" y="170">phone pose + its</text>
  <text class="tx" x="26" y="188">tracking state</text>
  <text class="tx" x="26" y="220">&#916;t, validity mask</text>
  <text class="sm" x="26" y="254">only PAST frames &#8212;</text>
  <text class="sm" x="26" y="272">nothing waits on the future</text>

  <!-- 2 GRAPH -->
  <rect class="ml" x="234" y="58" width="176" height="242"/>
  <text class="hd" x="250" y="88">Graph encoder</text>
  <text class="sm" x="250" y="108">along the skeleton only</text>
  <g stroke="#6a4fb0" stroke-width="2.2">
    <line x1="322" y1="142" x2="322" y2="196"/>
    <line x1="322" y1="156" x2="288" y2="182"/><line x1="288" y1="182" x2="280" y2="218"/>
    <line x1="322" y1="156" x2="356" y2="182"/><line x1="356" y1="182" x2="364" y2="218"/>
    <line x1="322" y1="196" x2="302" y2="238"/><line x1="302" y1="238" x2="299" y2="270"/>
    <line x1="322" y1="196" x2="342" y2="238"/><line x1="342" y1="238" x2="345" y2="270"/>
  </g>
  <g fill="#6a4fb0">
    <circle cx="322" cy="136" r="6"/><circle cx="322" cy="196" r="6"/>
    <circle cx="288" cy="182" r="6"/><circle cx="280" cy="218" r="6"/>
    <circle cx="356" cy="182" r="6"/><circle cx="364" cy="218" r="6"/>
    <circle cx="302" cy="238" r="6"/><circle cx="299" cy="270" r="6"/>
    <circle cx="342" cy="238" r="6"/><circle cx="345" cy="270" r="6"/>
  </g>

  <!-- 3 CAUSAL TCN -->
  <rect class="ml" x="438" y="58" width="236" height="242"/>
  <text class="hd" x="454" y="88">Causal TCN</text>
  <text class="sm" x="454" y="108">dilated, past-only</text>
  <g fill="#6a4fb0">
    <circle cx="470" cy="160" r="5"/><circle cx="500" cy="160" r="5"/><circle cx="530" cy="160" r="5"/>
    <circle cx="560" cy="160" r="5"/><circle cx="590" cy="160" r="5"/><circle cx="620" cy="160" r="5"/>
    <circle cx="650" cy="160" r="6.5"/>
    <circle cx="500" cy="204" r="5"/><circle cx="560" cy="204" r="5"/><circle cx="650" cy="204" r="6.5"/>
  </g>
  <g stroke="#6a4fb0" stroke-width="1.7" fill="none" opacity="0.85">
    <line x1="470" y1="160" x2="498" y2="200"/><line x1="500" y1="160" x2="500" y2="198"/>
    <line x1="530" y1="160" x2="558" y2="200"/><line x1="560" y1="160" x2="560" y2="198"/>
    <line x1="590" y1="160" x2="646" y2="200"/><line x1="650" y1="160" x2="650" y2="198"/>
    <line x1="500" y1="204" x2="644" y2="216" opacity="0.5"/>
    <line x1="560" y1="204" x2="646" y2="214" opacity="0.5"/>
  </g>
  <text class="sm" x="454" y="142">past</text>
  <text class="sm" x="630" y="142">now</text>
  <text class="tx" x="454" y="248">Every edge points forward</text>
  <text class="tx" x="454" y="266">in time. The output for now</text>
  <text class="tx" x="454" y="284">needs no future frame.</text>

  <!-- 4 MEASUREMENT HEAD -->
  <rect class="ml" x="702" y="58" width="188" height="242"/>
  <text class="hd" x="718" y="88">Measurement head</text>
  <text class="sm" x="718" y="108">14 segments, root excluded</text>
  <text class="tx" x="718" y="146">z&#7522; &#8212; &#8220;this segment</text>
  <text class="tx" x="718" y="164">looks off by...&#8221;</text>
  <text class="tx" x="718" y="198">&#963;&#7522; &#8212; how much to</text>
  <text class="tx" x="718" y="216">believe that</text>
  <text class="sm" x="718" y="250">an OBSERVATION,</text>
  <text class="sm" x="718" y="268">not the answer</text>

  <!-- 5 FILTER -->
  <rect class="fi" x="918" y="58" width="196" height="242"/>
  <text class="hd" x="934" y="88">14 scalar filters</text>
  <text class="sm" x="934" y="108">one per segment</text>
  <path d="M938,196 C970,192 990,186 1010,176 S1060,150 1098,142"
        fill="none" stroke="#b07d28" stroke-width="3"/>
  <g fill="#b07d28" opacity="0.55">
    <circle cx="960" cy="204" r="3.5"/><circle cx="986" cy="172" r="3.5"/>
    <circle cx="1012" cy="196" r="3.5"/><circle cx="1040" cy="150" r="3.5"/>
    <circle cx="1068" cy="172" r="3.5"/><circle cx="1094" cy="128" r="3.5"/>
  </g>
  <text class="sm" x="934" y="236">dots = noisy measurements</text>
  <text class="sm" x="934" y="254">line = the drift estimate</text>
  <text class="sm" x="934" y="272">bad &#963; &#8594; simply do not update</text>

  <!-- 6 APPLIED -->
  <rect class="bx" x="1142" y="58" width="148" height="242"/>
  <text class="hd" x="1158" y="88">Applied</text>
  <text class="tx" x="1158" y="124">rotate about</text>
  <text class="tx" x="1158" y="142">gravity only</text>
  <text class="sm" x="1158" y="164">roll and pitch are</text>
  <text class="sm" x="1158" y="180">untouchable</text>
  <text class="tx" x="1158" y="214">forward</text>
  <text class="tx" x="1158" y="232">kinematics</text>
  <text class="sm" x="1158" y="256">live skeleton</text>

  <path class="fl" d="M208,175 L232,175"/>
  <path class="fl" d="M412,175 L436,175"/>
  <path class="fl" d="M676,175 L700,175"/>
  <path class="fl" d="M892,175 L916,175"/>
  <path class="fl" d="M1116,175 L1140,175"/>

  <rect class="bx" x="10" y="330" width="1280" height="106"/>
  <text class="hd" x="32" y="362">Causal end to end &#8212; it runs while the suit is in use</text>
  <text class="tx" x="32" y="390">Two timescales. The pose moves at 32 Hz; the heading error creeps at a degree or so per minute.</text>
  <text class="tx" x="32" y="410">The filter holds that slow state, so the fast pose path never waits for anything.</text>
  <text class="tx" x="32" y="430">Roughly 150k parameters, one forward pass per frame, well under a millisecond.</text>
</svg>
