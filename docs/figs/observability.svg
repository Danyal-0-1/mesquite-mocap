<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica,Arial,sans-serif">
  <style>
    .t  { font-size: 15px; fill: #1a1a1a; }
    .tb { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .s  { font-size: 12.5px; fill: #555; }
    .ok { fill: #1f7a3d; }
    .no { fill: #b3261e; }
    .box{ fill: #fff; stroke: #c9c9c9; stroke-width: 1.4; rx: 8; }
  </style>

  <text class="tb" x="20" y="28">Why heading is the one degree of freedom nothing fixes</text>

  <!-- gravity panel -->
  <rect class="box" x="20" y="48" width="390" height="180"/>
  <text class="tb" x="40" y="76">Accelerometer sees gravity</text>
  <line x1="120" y1="96" x2="120" y2="186" stroke="#1f7a3d" stroke-width="3"/>
  <polygon points="120,196 113,180 127,180" fill="#1f7a3d"/>
  <text class="s" x="134" y="146">g</text>
  <circle cx="230" cy="140" r="42" fill="none" stroke="#1f7a3d" stroke-width="2.5"/>
  <line x1="230" y1="98" x2="230" y2="182" stroke="#1f7a3d" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="188" y1="140" x2="272" y2="140" stroke="#1f7a3d" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text class="t ok" x="292" y="128">roll ✓</text>
  <text class="t ok" x="292" y="152">pitch ✓</text>
  <text class="s" x="40" y="210">2 of 3 rotational DOF have an absolute reference.</text>

  <!-- yaw panel -->
  <rect class="box" x="440" y="48" width="400" height="180"/>
  <text class="tb" x="460" y="76">Rotation about gravity has none</text>
  <ellipse cx="620" cy="150" rx="78" ry="30" fill="none" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="620" y1="92" x2="620" y2="150" stroke="#999" stroke-width="2"/>
  <polygon points="700,150 686,143 686,157" fill="#b3261e"/>
  <polygon points="540,150 554,143 554,157" fill="#b3261e"/>
  <text class="t no" x="596" y="118">yaw ✗</text>
  <text class="s" x="460" y="200">Only a magnetometer or an external visual/optical</text>
  <text class="s" x="460" y="218">reference can fix it. Both are absent per sensor.</text>

  <!-- consequence -->
  <rect class="box" x="20" y="248" width="820" height="62"/>
  <text class="t" x="40" y="274">Consequence: each of the 15 sensors starts at its own arbitrary heading and wanders independently.</text>
  <text class="t" x="40" y="296">The limbs stay right <tspan class="ok">relative to each other</tspan>; the whole body points the <tspan class="no">wrong way in the room</tspan>.</text>
</svg>
